name: Fetch licensed article images

# Downloads the licensed source images listed in
# data-source/writing/article-image-sources.json (Wikimedia Commons), resizes
# them for the web and commits them to public/images/articles/. Run by hand.
# It never publishes the site; publishing stays a separate, approved action.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Article IDs, space separated"
        required: false
        type: string
        default: ""
      extra:
        description: "Other images to save, space separated, as public/path.jpg=https-url"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download
        if: inputs.ids != ''
        run: python scripts/writing/fetch_article_images.py ${{ inputs.ids }}
      - name: Resize for the web
        if: inputs.ids != ''
        run: |
          pip install --quiet pillow
          python - <<'PY'
          import json, pathlib
          from PIL import Image, ImageOps
          src = json.loads(pathlib.Path("data-source/writing/article-image-sources.json").read_text())
          out = pathlib.Path("public/images/articles"); out.mkdir(parents=True, exist_ok=True)
          for wid in "${{ inputs.ids }}".split():
              rec = src[wid]
              files = list(pathlib.Path("images/articles").glob(rec["slug"] + ".*"))
              if not files:
                  print("missing", wid); continue
              im = ImageOps.exif_transpose(Image.open(files[0])).convert("RGB")
              im.thumbnail((1600, 1600))
              dest = out / (rec["slug"] + ".jpg")
              im.save(dest, "JPEG", quality=82, optimize=True, progressive=True)
              print(wid, dest, im.size)
          PY
      - name: Other images
        if: inputs.extra != ''
        env:
          EXTRA: ${{ inputs.extra }}
        run: |
          pip install --quiet pillow
          python - <<'PY'
          import os, pathlib, urllib.request, io
          from PIL import Image
          for pair in os.environ["EXTRA"].split():
              dest, url = pair.split("=", 1)
              assert dest.startswith("public/") and url.startswith("https://"), pair
              import subprocess
              data = subprocess.run(["curl", "-fsSL", "--retry", "2", url], check=True, capture_output=True).stdout
              try:
                  im = Image.open(io.BytesIO(data)).convert("RGB")
              except Exception:
                  print("not an image:", dest, len(data), data[:200]); raise
              im.thumbnail((1600, 1600))
              out = pathlib.Path(dest); out.parent.mkdir(parents=True, exist_ok=True)
              im.save(out, "JPEG", quality=84, optimize=True, progressive=True)
              print(dest, im.size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/images
          git diff --cached --quiet && { echo "Nothing new"; exit 0; }
          git commit -m "Add site images ${{ inputs.ids }}"
          git push
